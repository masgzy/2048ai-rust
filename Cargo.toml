[package]
name = "ai2048"
version = "2.0.1"
edition = "2021"
description = "2048 AI 服务器：Rust 位棋盘 expectimax 引擎 + WebSocket，零第三方依赖"
license = "MIT"

[lib]
name = "ai2048"
path = "src/lib.rs"

[[bin]]
name = "ai2048"
path = "src/main.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
