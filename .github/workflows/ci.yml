name: CI

# 代码质量与测试：格式检查、clippy、最低支持的 Rust 版本、单元测试，以及对真实二进制的
# 端到端冒烟测试。交叉编译与发布见 build.yml。
#
# 测试只在 ubuntu 与 windows 两个 runner 上跑（公共 runner 资源有限，macOS 不参与日常测试）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支 / 同一 PR 的新推送取消尚未结束的旧运行；标签推送不取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 安装 rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # ubuntu 镜像预装的工具链不含 clippy，需要显式安装
      - name: 安装 clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: MSRV 1.82
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.82 --profile minimal
      - run: cargo +1.82 check --all-targets --locked

  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            exe: ""
          - os: windows-latest
            exe: ".exe"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal

      - name: 单元测试（debug）
        run: cargo test --locked
      - name: 单元测试（release）
        run: cargo test --release --locked
      - name: 构建 release 二进制
        run: cargo build --release --locked --bins

      - name: 读取版本号
        id: ver
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      # 辅助程序做一次极短的真实运行：深度上限 3 的一局自对弈 + 2 局 TD 训练
      - name: simulate / train 自检
        run: |
          target/release/simulate${{ matrix.exe }} --version
          target/release/simulate${{ matrix.exe }} --games 1 --max-depth 3 2>/dev/null | tail -5
          target/release/train${{ matrix.exe }} --games 2 --out "$RUNNER_TEMP/weights.json"
          test -s "$RUNNER_TEMP/weights.json"

      - name: 冒烟测试（真实二进制）
        run: python .github/scripts/smoke.py target/release/ai2048${{ matrix.exe }} --version "${{ steps.ver.outputs.version }}"
